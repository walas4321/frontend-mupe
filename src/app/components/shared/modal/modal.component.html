<div class="modal modal-backdrop fade show d-block pe-3" [id]="modal.id" tabindex="-1" role="dialog"
	aria-labelledby="modal-scroll" aria-hidden="true" [style.z-index]="modal.index ? modal.index : 1">
	<div class="modal-dialog modal-dialog-centered {{ size }}" style="max-width: 350px" role="document">
		<div class="modal-content text-center" [ngSwitch]="isLoading">
			<sbn-loading [message]="modal.loading" *ngSwitchCase="true"></sbn-loading>
			<ng-container *ngSwitchDefault>
				<ng-container *ngTemplateOutlet="childrenCabecera"> </ng-container>
				<div class="modal-header border-0 pt-4 pb-0 px-4">
					<h5 class="modal-title w-100" id="title">
						{{ modal.title }}
					</h5>
				</div>
				<div class="modal-body border-0 px-4">
					<h5 class="modal-subtitle mx-auto my-0" *ngIf="modal.subtitle">
						
						<div [innerHTML]="modal?.subtitle"></div>
					</h5>
				</div>

				<div class="modal-footer border-0 pt-0 pb-4 px-4 d-flex">
					<button type="button" class="btn btn-secondary col" data-dismiss="modal" *ngIf="modal.bad"
						(click)="cerrarModal($event)">
						<span class="feather icon-x me-1"></span>
						{{ modal.bad }}
					</button>
					<button type="button" class="btn btn-primary col"
						[disabled]="aceptarModal === null || okActive !== undefined? okActive : false"
						(click)="okActive = true; aceptarModal($event);">
						<span class="feather icon-check me-1"></span>
						{{ modal.ok }}
					</button>
					<!-- <button type="button" class="btn btn-secondary btn-cancel" data-dismiss="modal" *ngIf="modal.bad"
						(click)="cerrarModal($event)">
						<span class="feather icon-x mx-2"></span>
					</button> -->
					<!-- <button type="button" class="btn btn-primary btn-ok"
						[disabled]="aceptarModal === null || okActive !== undefined? okActive : false" (click)="okActive = true; aceptarModal($event);">
						<span class="feather icon-check mx-2"></span> {{ modal.ok }}
					</button> -->
				</div>
			</ng-container>
		</div>
	</div>
</div>
