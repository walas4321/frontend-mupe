<app-headers></app-headers>

<div class="container py-5">
    <div class="card border-0 shadow-sm">
        <div class="card-body p-0">
            <div class="row g-0">
                <div class="col-md-6 p-4 p-md-5">
                    <div class="svg-container">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" class="construction-svg">
                            <!-- Background shapes -->
                            <rect x="0" y="0" width="800" height="500" fill="#f8f9fa" rx="20" ry="20" />

                            <!-- Grid lines -->
                            <g class="grid-lines">
                                <path d="M0,100 L800,100" stroke="#e9ecef" stroke-width="1" />
                                <path d="M0,200 L800,200" stroke="#e9ecef" stroke-width="1" />
                                <path d="M0,300 L800,300" stroke="#e9ecef" stroke-width="1" />
                                <path d="M0,400 L800,400" stroke="#e9ecef" stroke-width="1" />
                                <path d="M100,0 L100,500" stroke="#e9ecef" stroke-width="1" />
                                <path d="M200,0 L200,500" stroke="#e9ecef" stroke-width="1" />
                                <path d="M300,0 L300,500" stroke="#e9ecef" stroke-width="1" />
                                <path d="M400,0 L400,500" stroke="#e9ecef" stroke-width="1" />
                                <path d="M500,0 L500,500" stroke="#e9ecef" stroke-width="1" />
                                <path d="M600,0 L600,500" stroke="#e9ecef" stroke-width="1" />
                                <path d="M700,0 L700,500" stroke="#e9ecef" stroke-width="1" />
                            </g>

                            <!-- Construction elements -->
                            <g class="construction-elements">
                                <!-- Base platform -->
                                <rect x="150" y="350" width="500" height="20" fill="#495057" rx="2" ry="2" />

                                <!-- Scaffold bars -->
                                <rect x="200" y="200" width="15" height="150" fill="#6c757d" />
                                <rect x="585" y="200" width="15" height="150" fill="#6c757d" />

                                <!-- Scaffold horizontal bars -->
                                <rect x="190" y="210" width="425" height="10" fill="#6c757d" />
                                <rect x="190" y="270" width="425" height="10" fill="#6c757d" />
                                <rect x="190" y="330" width="425" height="10" fill="#6c757d" />

                                <!-- Computer/Server -->
                                <g class="computer">
                                    <rect x="350" y="220" width="100" height="80" fill="#0d6efd" rx="5" ry="5" />
                                    <rect x="360" y="230" width="80" height="50" fill="#e7f5ff" rx="2" ry="2" />
                                    <rect x="365" y="240" width="70" height="5" fill="#0d6efd" opacity="0.5" />
                                    <rect x="365" y="250" width="40" height="5" fill="#0d6efd" opacity="0.5" />
                                    <rect x="365" y="260" width="60" height="5" fill="#0d6efd" opacity="0.5" />
                                    <rect x="365" y="270" width="30" height="5" fill="#0d6efd" opacity="0.5" />
                                    <!-- Server lights -->
                                    <circle cx="430" cy="235" r="3" fill="#20c997" class="server-light" />
                                    <circle cx="420" cy="235" r="3" fill="#ffc107" class="server-light" />
                                </g>

                                <!-- Developer figure -->
                                <g class="developer">
                                    <!-- Body -->
                                    <rect x="250" y="250" width="30" height="50" fill="#0d6efd" rx="10" ry="10" />
                                    <!-- Head -->
                                    <circle cx="265" cy="235" r="15" fill="#ffe8cc" />
                                    <!-- Arms -->
                                    <rect x="245" y="260" width="40" height="10" fill="#0d6efd" rx="5" ry="5" />
                                    <!-- Code thought bubble -->
                                    <path d="M290,220 Q310,200 330,220 L330,250 Q310,270 290,250 Z" fill="white"
                                        stroke="#dee2e6" stroke-width="2" />
                                    <!-- Code lines -->
                                    <rect x="300" y="225" width="20" height="3" fill="#0d6efd" />
                                    <rect x="300" y="235" width="15" height="3" fill="#0d6efd" />
                                    <rect x="300" y="245" width="20" height="3" fill="#0d6efd" />
                                </g>

                                <!-- Tools -->
                                <g class="tools">
                                    <!-- Gear icon -->
                                    <g class="gear" transform="translate(500, 250)">
                                        <circle cx="0" cy="0" r="20" fill="#495057" />
                                        <circle cx="0" cy="0" r="10" fill="#e9ecef" />
                                        <rect x="-3" y="-25" width="6" height="10" fill="#495057" />
                                        <rect x="-3" y="15" width="6" height="10" fill="#495057" />
                                        <rect x="-25" y="-3" width="10" height="6" fill="#495057" />
                                        <rect x="15" y="-3" width="10" height="6" fill="#495057" />
                                        <rect x="-20" y="-20" width="10" height="6" fill="#495057"
                                            transform="rotate(45)" />
                                        <rect x="10" y="-20" width="10" height="6" fill="#495057"
                                            transform="rotate(45)" />
                                        <rect x="-20" y="14" width="10" height="6" fill="#495057"
                                            transform="rotate(45)" />
                                        <rect x="10" y="14" width="10" height="6" fill="#495057"
                                            transform="rotate(45)" />
                                    </g>

                                    <!-- Document icon -->
                                    <g class="document" transform="translate(520, 300)">
                                        <rect x="0" y="0" width="25" height="30" fill="white" stroke="#ced4da"
                                            stroke-width="1" />
                                        <rect x="5" y="5" width="15" height="2" fill="#adb5bd" />
                                        <rect x="5" y="10" width="15" height="2" fill="#adb5bd" />
                                        <rect x="5" y="15" width="10" height="2" fill="#adb5bd" />
                                    </g>
                                </g>
                            </g>

                            <!-- Progress bar -->
                            <g class="progress">
                                <rect x="200" y="400" width="400" height="15" fill="#e9ecef" rx="7.5" ry="7.5" />
                                <rect x="200" y="400" width="160" height="15" fill="#0d6efd" rx="7.5" ry="7.5"
                                    class="progress-fill" />
                            </g>
                        </svg>
                    </div>
                </div>
                <div class="col-md-6 p-4 p-md-5 d-flex align-items-center">
                    <div class="construction-text">
                        <h1 class="display-6 fw-bold mb-3">{{ pageName }} <span class="text-primary">en
                                desarrollo</span></h1>
                        <p class="lead mb-3">Estamos trabajando en esta página para mejorar tu experiencia.</p>

                        <div class="alert alert-primary border-start border-4 mb-4">
                            <div class="d-flex">
                                <div class="me-3">
                                    <i class="bi bi-info-circle-fill fs-4"></i>
                                </div>
                                <div>
                                    Nuestro equipo está implementando y optimizando esta funcionalidad. Estará
                                    disponible próximamente.
                                </div>
                            </div>
                        </div>

                        <div class="mb-4">
                            <div class="d-flex justify-content-between mb-2">
                                <span class="text-muted">Progreso estimado:</span>
                                <span class="fw-bold">40%</span>
                            </div>
                            <div class="progress" style="height: 8px;">
                                <div class="progress-bar progress-bar-striped progress-bar-animated" role="progressbar"
                                    style="width: 40%" aria-valuenow="40" aria-valuemin="0" aria-valuemax="100"></div>
                            </div>
                        </div>

                        <button class="btn btn-primary" (click)="goBack()">
                            <i class="bi bi-arrow-left me-2"></i>Volver al Inicio
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
